apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: norn-shop
  labels:
    app: catalog-api
spec:
  replicas: 1 # baseline do kustomize base (tarefa 4) — ponto de partida do ScaleUp, maxReplicas=3 (§5.4)
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 5678
      containers:
        - name: catalog-api
          image: norn-shop-catalog-api:placeholder
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-common-config
            - secretRef:
                name: shop-common-secret
            - secretRef:
                name: catalog-db-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # Baixo de propósito (192-256Mi): é o teto que faz F1 produzir
              # OOMKilled em minutos, não em dezenas de minutos (Fase 5/6).
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: dataprotection-keys
              mountPath: /home/nornapp/.aspnet/DataProtection-Keys
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dataprotection-keys
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: norn-shop
spec:
  selector:
    app: catalog-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080 # entrada de tráfego do Shop (D9) — mapeada no k3d cluster create
  type: NodePort
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-api
  namespace: norn-shop
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: catalog-api
