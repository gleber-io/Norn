name: norn-otel

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: norn-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      TRACE_SAMPLING_PERCENTAGE: "${TRACE_SAMPLING_PERCENTAGE:-10}"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # métricas expostas para o Prometheus
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: norn-prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      # Gerado pelo bootstrap.ps1 a partir do ServiceAccount da tarefa 5a — nunca versionado.
      - ./cadvisor-token:/etc/prometheus/cadvisor-token:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=exemplar-storage"
      # Tarefa 8 da Fase 4: retenção cobre semanas de desenvolvimento até a campanha (Fase 12);
      # o teto de tamanho é o que protege o disco quando o tempo não basta como limite.
      # 3GB (valor original) nunca foi validado contra o padrão real de série da campanha —
      # achado ao planejar a campanha de 25h: cada RestartPod cria uma série nova no Prometheus
      # (exported_instance muda a cada pod, nunca reaproveitado), e 60 execuções com múltiplos
      # restarts cada podem gerar bem mais churn que os ~384MB de uso hoje. Subido pra 15GB —
      # a máquina tem 122GB livres (checado ao vivo), então a folga é praticamente de graça, e
      # elimina o risco de evictar a janela das primeiras execuções antes da análise (ADR-09 é
      # sobre RAM/GPU, não disco — a citação anterior aqui estava errada).
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=15GB"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    container_name: norn-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # API HTTP do Tempo (usada pelo datasource do Grafana)

  grafana:
    image: grafana/grafana:11.4.0
    container_name: norn-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceToMetrics"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
