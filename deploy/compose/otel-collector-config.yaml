receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Amostragem de traces — 10% na campanha, 100% em demonstração (§7.5).
  # Sobrescrever via TRACE_SAMPLING_PERCENTAGE no ambiente do serviço otel-collector.
  probabilistic_sampler:
    sampling_percentage: ${env:TRACE_SAMPLING_PERCENTAGE:-10}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [probabilistic_sampler, batch]
      exporters: [otlp/tempo]
