global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # rabbitmq_prometheus — profundidade de fila e consumer lag (tarefa 5 da Fase 4).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
