global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # rabbitmq_prometheus — profundidade de fila e consumer lag (tarefa 5 da Fase 4).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Única fonte de métrica de container (tarefa 5a da Fase 6) — container_oom_events_total
  # (metade da definição de onset, §3), container_memory_working_set_bytes e
  # container_cpu_usage_seconds_total (Overhead do Norn, §3). O nó "k3d-norn-server-0" só
  # resolve porque bootstrap.ps1 conecta este container à rede Docker do cluster k3d.
  - job_name: kubelet-cadvisor
    metrics_path: /metrics/cadvisor
    scheme: https
    tls_config:
      insecure_skip_verify: true # certificado do kubelet não é emitido para este hostname
    authorization:
      credentials_file: /etc/prometheus/cadvisor-token
    static_configs:
      - targets: ["k3d-norn-server-0:10250"]
