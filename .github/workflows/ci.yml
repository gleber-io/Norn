name: CI

on:
  push:
  pull_request:

jobs:
  dotnet-fast-gate:
    name: Portão rápido .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Verificar formatação
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore

      - name: Testes unitários e de arquitetura
        # --ignore-exit-code 8: sob MTP (ADR-11), um assembly de teste cujo filtro não casa
        # nenhum teste sai com código 8 ("zero testes"), e isso derrubaria o portão mesmo com os
        # 80+ testes reais verdes — o filtro divide unitários de integração por FullyQualifiedName,
        # então os assemblies *.IntegrationTests sempre ficam vazios aqui, de propósito.
        run: >
          dotnet test --no-build
          --filter "FullyQualifiedName!~IntegrationTests"
          --coverage
          --ignore-exit-code 8

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    # web/norn-dashboard só nasce na Fase 11 — sem esta guarda o CI nasce vermelho
    # e fica assim por dez fases, treinando a ignorar o vermelho.
    if: hashFiles('web/norn-dashboard/package-lock.json') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/norn-dashboard/package-lock.json

      - name: Install
        working-directory: web/norn-dashboard
        run: npm ci

      - name: Lint e formatação (Biome)
        working-directory: web/norn-dashboard
        run: npm run lint

      - name: Testes
        working-directory: web/norn-dashboard
        run: npm run test

      - name: Build
        working-directory: web/norn-dashboard
        run: npm run build

  integration:
    name: Integração (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore

      - name: Testes de integração
        # --ignore-exit-code 8: mesmo motivo do portão rápido, invertido — os assemblies
        # *.UnitTests e Architecture ficam vazios aqui, de propósito.
        run: >
          dotnet test --no-build
          --filter "FullyQualifiedName~IntegrationTests"
          --ignore-exit-code 8
